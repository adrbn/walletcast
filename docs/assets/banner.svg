<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <clipPath id="screen"><rect x="862" y="78" width="316" height="440" rx="46"/></clipPath>
  </defs>

  <rect width="1280" height="480" fill="#000000"/>
  <rect width="1280" height="480" fill="url(#glow)"/>

  <!-- App icon + wordmark -->
  <g transform="translate(96 104)">
    <rect width="56" height="56" rx="13" fill="url(#iconbg)"/>
    <rect x="11.5" y="22" width="33" height="21" rx="4" fill="#FFFFFF"/>
    <rect x="15.5" y="26.5" width="11" height="2.4" rx="1.2" fill="#4338CA"/>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2.6">
      <path d="M37 13 a7 7 0 0 1 7 7"/>
      <path d="M37 8 a12 12 0 0 1 12 12" opacity="0.55"/>
    </g>
    <text x="74" y="38" font-size="26" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">WalletCast</text>
  </g>

  <text x="94" y="250" font-size="68" font-weight="700" fill="url(#title)" letter-spacing="-2">Notifications.</text>
  <text x="94" y="326" font-size="68" font-weight="700" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="-2">Without the app.</text>
  <text x="96" y="384" font-size="22" fill="#A1A1AA" letter-spacing="-0.2">Reach your customers' lock screen through Apple &amp; Google Wallet.</text>
  <text x="96" y="416" font-size="22" fill="#A1A1AA" letter-spacing="-0.2">Open source. Self-hosted. No per-message fees.</text>

  <!-- iPhone -->
  <rect x="850" y="66" width="340" height="464" rx="58" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="862" y="78" width="316" height="440" fill="url(#wall)"/>
    <rect x="975" y="92" width="90" height="26" rx="13" fill="#000000"/>
    <text x="1020" y="160" font-size="15" font-weight="600" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">Tuesday 12 May</text>
    <text x="1020" y="232" font-size="78" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle" letter-spacing="-2">9:41</text>

    <!-- notification -->
    <g transform="translate(876 272)">
      <rect width="288" height="84" rx="20" fill="#FFFFFF" fill-opacity="0.82"/>
      <rect x="12" y="14" width="34" height="34" rx="8" fill="#111827"/>
      <text x="29" y="37" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
      <text x="56" y="28" font-size="13.5" font-weight="600" fill="#000000">Lu's Café</text>
      <text x="276" y="28" font-size="11.5" fill="#3C3C43" fill-opacity="0.6" text-anchor="end">now</text>
      <text x="56" y="47" font-size="13.5" fill="#000000">Flash sale: 2 croissants for 1</text>
      <text x="56" y="65" font-size="13.5" fill="#000000">until noon.</text>
    </g>
    <g transform="translate(886 366)" opacity="0.7">
      <rect width="268" height="60" rx="18" fill="#FFFFFF" fill-opacity="0.55"/>
      <rect x="12" y="13" width="30" height="30" rx="7" fill="#4F46E5"/>
      <text x="54" y="27" font-size="12.5" font-weight="600" fill="#000000">Yoga Loft</text>
      <text x="54" y="44" font-size="12.5" fill="#000000">Sunday class moved to 10am</text>
    </g>
  </g>
</svg>
