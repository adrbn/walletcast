name: Glow refresh

# Moves day-glow passes to the current colour slot. Needs two repository secrets:
# GLOW_CRON_URL (https://<host>/api/cron/glow) and CRON_SECRET (same value as on the server).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call the glow route
        env:
          URL: ${{ secrets.GLOW_CRON_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "GLOW_CRON_URL or CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" "$URL"
